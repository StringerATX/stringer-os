<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stringer OS">
<title>Stringer OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111110;color:#f2eee4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:17px;max-width:480px;margin:0 auto;min-height:100vh;-webkit-text-size-adjust:100%;}
button{font-family:inherit;cursor:pointer;}input,select,textarea{font-family:inherit;font-size:17px;}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;}
#ltitle{font-size:14px;letter-spacing:.3em;color:#c3bcab;text-transform:uppercase;}
#lmsg{font-size:15px;color:#9a9384;text-align:center;max-width:260px;}
.header{background:#1a1a18;border-bottom:1px solid #3d3831;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.header.detail{gap:10px;}
.hback{background:transparent;border:none;color:#f0a03f;font-size:26px;padding:0 8px 0 0;flex-shrink:0;}
.htitle{font-size:13px;letter-spacing:.2em;color:#c3bcab;text-transform:uppercase;}
.hname{font-size:17px;font-weight:600;margin-top:1px;}
.hname.project{font-size:16px;font-weight:600;color:#f2eee4;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ubadge{background:#2b2823;border:none;color:#f2eee4;padding:6px 12px;border-radius:4px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.udot{width:8px;height:8px;border-radius:50%;background:#f0a03f;}
.udot.crew{background:#5d9b6e;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#1a1a18;border-top:1px solid #3d3831;display:flex;z-index:50;}
.nbtn{flex:1;padding:12px 0 14px;background:transparent;border:none;color:#c3bcab;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nbtn.active{color:#f0a03f;}
.nicon{font-size:17px;}.nlabel{font-size:13px;letter-spacing:.12em;}
.content{padding-bottom:140px;}
.subnav{background:#1a1a18;border-bottom:1px solid #3d3831;display:flex;padding:0 16px;}
.sbtn{padding:12px 16px 11px;background:transparent;border:none;border-bottom:2px solid transparent;color:#c3bcab;font-size:13px;letter-spacing:.15em;margin-bottom:-1px;}
.sbtn.active{color:#f0a03f;border-bottom-color:#f0a03f;}
.slabel{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.slabel span{font-size:13px;letter-spacing:.18em;color:#c3bcab;text-transform:uppercase;}
.slabel .cnt{color:#9a9384;}.slabel hr{flex:1;border:none;border-top:1px solid #3d3831;}
.pad{padding:16px 16px 0;}
.empty{padding:16px 0;font-size:14px;color:#9a9384;letter-spacing:.1em;}
.titem{border-bottom:1px solid #2b2823;padding:10px 0;}
.trow{display:flex;align-items:flex-start;gap:9px;cursor:pointer;}
.pdot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.tbody{flex:1;min-width:0;}
.ttrade{font-size:13px;letter-spacing:.1em;color:#c3bcab;text-transform:uppercase;margin-bottom:2px;}
.tdesc{font-size:16px;line-height:1.4;color:#f2eee4;}
.tdesc.done{color:#c3bcab;text-decoration:line-through;}
.taction{font-size:14px;color:#f0a03f;margin-top:3px;}
.tmeta{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap;}
.tmeta span{font-size:13px;color:#c3bcab;}
.sbadge{padding:2px 6px;border-radius:3px;font-size:13px;color:white;flex-shrink:0;white-space:nowrap;}
.sacts{display:flex;gap:5px;flex-wrap:wrap;padding:8px 0 0 15px;}
.sact{padding:4px 8px;border-radius:3px;border:none;font-size:13px;color:#c3bcab;background:#2b2823;cursor:pointer;}
.sact.active{color:#15150f;font-weight:600;}
.tnote{font-size:14px;color:#8a8578;margin-top:3px;line-height:1.4;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tchev{color:#9a9384;font-size:22px;line-height:1;align-self:center;flex-shrink:0;}
.td-top{display:flex;gap:10px;align-items:flex-start;}
.td-desc{font-size:20px;line-height:1.35;color:#f2eee4;font-weight:500;}
.td-desc.done{color:#c3bcab;text-decoration:line-through;}
.td-meta{display:flex;gap:28px;margin-top:16px;}
.td-mlabel{font-size:13px;letter-spacing:.12em;color:#c3bcab;text-transform:uppercase;}
.td-mval{font-size:16px;color:#f2eee4;margin-top:3px;font-weight:500;}
.td-slabel{font-size:13px;letter-spacing:.18em;color:#c3bcab;text-transform:uppercase;margin:16px 0 8px;}
.td-notes{width:100%;background:#111110;border:1px solid #3d3831;border-radius:4px;color:#f2eee4;font-size:17px;padding:10px;outline:none;resize:vertical;min-height:120px;margin-bottom:12px;}
.td-attach{background:#2b2823;color:#f0a03f;padding:11px 16px;border-radius:4px;font-size:16px;text-decoration:none;display:inline-flex;align-items:center;}
.td-delbtn{margin-top:24px;background:transparent;border:1px solid #3a2422;color:#a04a3c;padding:10px 14px;border-radius:4px;font-size:16px;}
.td-del{margin-top:20px;background:#1a1010;border:1px solid #3a2422;border-radius:6px;padding:14px;}
.td-delnote{font-size:13px;color:#c3bcab;margin-top:8px;line-height:1.4;}
.td-descedit{width:100%;background:#111110;border:1px solid #3d3831;border-radius:4px;color:#f2eee4;font-size:17px;font-weight:500;line-height:1.35;padding:8px;outline:none;resize:vertical;min-height:60px;margin-top:2px;}
.td-editlink{background:transparent;border:none;color:#c3bcab;font-size:14px;padding:4px 0 0;margin-top:2px;text-decoration:underline;}
.restorebtn{margin-top:8px;background:#2b2823;border:none;color:#5d9b6e;padding:5px 10px;border-radius:3px;font-size:14px;}
.pcard{margin-bottom:8px;background:#1a1a18;border-radius:6px;overflow:hidden;border:1px solid #3d3831;cursor:pointer;}
.phdr{width:100%;background:transparent;border:none;padding:13px 14px;display:flex;align-items:center;gap:10px;text-align:left;}
.pbar{width:3px;height:36px;border-radius:2px;flex-shrink:0;}
.pinfo{flex:1;}.pname{font-size:16px;font-weight:500;color:#f2eee4;}.psub{font-size:14px;color:#c3bcab;margin-top:2px;}
.pbadges{display:flex;gap:6px;align-items:center;}
.badge{padding:2px 6px;border-radius:3px;font-size:13px;color:white;}
.proj-budget{background:#1a1a18;padding:12px 16px;border-bottom:1px solid #3d3831;display:flex;gap:16px;flex-wrap:wrap;}
.proj-budget-item{display:flex;flex-direction:column;gap:2px;}
.proj-budget-label{font-size:13px;letter-spacing:.12em;color:#c3bcab;text-transform:uppercase;}
.proj-budget-val{font-size:16px;font-weight:500;color:#f2eee4;}
.proj-budget-val.red{color:#e0553f;}.proj-budget-val.green{color:#5d9b6e;}
.proj-status{display:flex;gap:8px;align-items:center;padding:10px 16px;background:#1a1a18;border-bottom:1px solid #3d3831;}
.status-pill{padding:3px 8px;border-radius:3px;font-size:13px;letter-spacing:.08em;color:white;}
.shitem{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #2b2823;}
.shchk{width:22px;height:22px;border-radius:3px;border:1px solid #9a9384;background:transparent;color:white;font-size:14px;flex-shrink:0;cursor:pointer;}
.shchk.bought{background:#5d9b6e;border-color:#5d9b6e;}
.shbody{flex:1;}.shdesc{font-size:16px;color:#f2eee4;}.shdesc.bought{color:#c3bcab;text-decoration:line-through;}
.shmeta{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap;}.shmeta span{font-size:13px;color:#c3bcab;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:4px 10px;border-radius:3px;border:1px solid #3d3831;font-size:13px;color:#c3bcab;background:transparent;cursor:pointer;}
.chip.active{border:none;color:#15150f;background:#f0a03f;font-weight:600;}
.cdiv{width:100%;height:1px;background:#3d3831;margin:4px 0;}
.mitem{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #2b2823;}
.catdot{width:4px;height:4px;border-radius:50%;margin-top:7px;flex-shrink:0;}
.mbody{flex:1;}.mdesc{font-size:16px;line-height:1.4;color:#f2eee4;}.mdesc.done{color:#c3bcab;text-decoration:line-through;}
.mcat{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9a9384;margin-top:2px;}
.chkbtn{width:26px;height:26px;border-radius:4px;border:none;font-size:16px;flex-shrink:0;cursor:pointer;}
.chkbtn.done{background:#5d9b6e;color:white;}.chkbtn.undone{background:#2b2823;color:#c3bcab;}
.iitem{padding:11px 0;border-bottom:1px solid #2b2823;}
.icat{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#f0a03f;margin-bottom:3px;}
.itext{font-size:16px;line-height:1.5;color:#f2eee4;}.idate{font-size:13px;color:#9a9384;margin-top:4px;}
.irow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.rmbtn{background:transparent;border:none;color:#9a9384;font-size:17px;padding:0 4px;cursor:pointer;}
.person-item{padding:12px 0;border-bottom:1px solid #2b2823;cursor:pointer;}
.person-row{display:flex;align-items:flex-start;gap:10px;}
.person-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.person-body{flex:1;}.person-name{font-size:16px;font-weight:500;}.person-role{font-size:13px;color:#c3bcab;margin-top:1px;}
.person-note{font-size:15px;color:#c3bcab;margin-top:4px;line-height:1.4;}
.person-next{font-size:14px;color:#f0a03f;margin-top:4px;}
.person-days{font-size:13px;color:#9a9384;margin-top:2px;}
.person-detail{background:#1a1a18;border-radius:4px;padding:12px;margin-top:8px;}
.vi-item{background:#1a1a18;border-radius:4px;padding:10px 12px;margin-bottom:6px;}
.vi-raw{font-size:15px;color:#f2eee4;line-height:1.4;}
.vi-meta{font-size:13px;color:#9a9384;margin-top:4px;display:flex;gap:8px;}
.vi-actions{display:flex;gap:6px;margin-top:8px;}
.vi-btn{padding:4px 10px;border-radius:3px;border:none;font-size:13px;cursor:pointer;background:#3d3831;color:#c3bcab;}
.vi-done{background:#5d9b6e;color:white;}
.capture-fab{position:fixed;bottom:76px;right:16px;width:56px;height:56px;border-radius:50%;background:#f0a03f;border:none;color:#15150f;font-size:28px;z-index:100;display:none;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.5);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;}
.modal{background:#1a1a18;border-top:1px solid #3d3831;width:100%;max-width:480px;margin:0 auto;padding:20px 16px 40px;border-radius:12px 12px 0 0;}
.modal-title{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#c3bcab;margin-bottom:14px;}
.modal textarea{width:100%;background:#111110;border:1px solid #3d3831;border-radius:4px;color:#f2eee4;font-size:17px;padding:10px;outline:none;resize:none;height:80px;margin-bottom:10px;}
.route-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.route-chip{padding:6px 12px;border-radius:3px;border:1px solid #3d3831;font-size:14px;color:#c3bcab;background:transparent;cursor:pointer;}
.route-chip.active{background:#f0a03f;border:none;color:#15150f;font-weight:600;}
.fbox{background:#0d0d0c;border:1px solid #3d3831;border-radius:6px;padding:14px;margin-top:10px;}
.finput{width:100%;background:transparent;border:none;border-bottom:1px solid #3d3831;color:#f2eee4;font-size:17px;outline:none;padding-bottom:8px;margin-bottom:10px;}
.ftarea{width:100%;background:transparent;border:none;border-bottom:1px solid #3d3831;color:#f2eee4;font-size:17px;outline:none;resize:none;padding-bottom:8px;margin-bottom:10px;}
.fsel{background:#2b2823;border:none;color:#f2eee4;padding:8px 10px;border-radius:3px;font-size:16px;}
.frow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.facts{display:flex;gap:8px;}
.bprim{flex:1;background:#f0a03f;border:none;color:#15150f;padding:11px;border-radius:4px;font-size:17px;font-weight:500;cursor:pointer;}
.bcan{background:#2b2823;border:none;color:#c3bcab;padding:11px 16px;border-radius:4px;font-size:17px;cursor:pointer;}
.bpill{padding:5px 10px;border-radius:3px;border:none;font-size:14px;cursor:pointer;}
.addbtn{width:100%;margin-top:12px;background:transparent;border:1px dashed #3d3831;color:#c3bcab;padding:12px;border-radius:4px;font-size:16px;cursor:pointer;}
.addcreative{border-color:#f0a03f!important;color:#f0a03f!important;margin-bottom:16px;font-size:16px;padding:14px;margin-top:0;}
/* ─── Readability pass (2026-09-02): larger touch targets, looser leading ─── */
.tdesc{line-height:1.45;}
.titem{padding:13px 0;}
.mitem{padding:14px 0;}
.ttrade,.mcat,.icat{letter-spacing:.08em;}
.tmeta span,.shmeta span{font-weight:500;}
.slabel span{font-size:13px;letter-spacing:.14em;color:#c3bcab;}
.slabel .cnt{color:#9a9384;}
.sbtn{font-size:13px;letter-spacing:.1em;padding:14px 16px 13px;}
.nlabel{font-size:10px;letter-spacing:.02em;}
@media (min-width:430px){.nlabel{font-size:12px;letter-spacing:.07em;}}
.nicon{font-size:19px;}
.nbtn{padding:11px 0 13px;}
.chip{padding:7px 13px;font-size:13px;color:#c3bcab;}
.sact{padding:7px 12px;font-size:13px;color:#c3bcab;}
.empty{font-size:14px;color:#9a9384;}
.tnote{color:#b3ab9b;font-size:14px;}
.person-note{color:#b3ab9b;}
.td-mlabel,.td-slabel{font-size:12px;letter-spacing:.14em;color:#c3bcab;}
.chkbtn{width:32px;height:32px;font-size:15px;}
.shchk{width:26px;height:26px;}

/* ─── Rhythm (day) tab ─── */
.rhrow{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid #2b2823;}
.rhtime{width:66px;flex-shrink:0;font-size:14px;font-weight:600;color:#f0a03f;letter-spacing:.04em;padding-top:2px;}
.rhtime.approx{color:#9a9384;font-weight:500;}
.rhitems{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
.rhitem{display:flex;align-items:flex-start;gap:11px;}
.rhbody{flex:1;min-width:0;}
.rhdesc{font-size:16px;line-height:1.4;color:#f2eee4;}
.rhdesc.done{color:#9a9384;text-decoration:line-through;}
.rhcat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9a9384;margin-top:2px;}
.rhblock{margin-bottom:6px;}
.rhnote{font-size:13px;color:#9a9384;line-height:1.5;padding:10px 0 2px;}

/* ─── Wide / desktop layout ───────────────────────────────────────────────
   Breakpoint is deliberately low (720px). A browser window that is not
   maximised, or a laptop running Windows display scaling at 150%, reports
   well under 900px of CSS width even on a large monitor - at 900px those
   machines kept getting the 480px phone column. Measured case: 887px.
   There is no max-width above the breakpoint on purpose: on a monitor this
   should fill the screen the way a spreadsheet does, not sit in a letterbox.
   Line length is capped on the detail views only, where it actually hurts. */
@media (min-width:720px){
  body{max-width:none;width:100%;font-size:17px;}
  .bnav,.crewfoot{max-width:none;}
  .modal{max-width:720px;}
  .pad{padding:20px 24px 0;display:grid;
       grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
       gap:0 28px;align-items:start;}
  /* Default is full-width span; cards opt IN to the columns. Keeps detail
     views from column-splitting when new markup is added later. */
  .pad > *{grid-column:1/-1;}
  .pad > .titem,.pad > .pcard,.pad > .mitem,.pad > .iitem,
  .pad > .person-item,.pad > .shitem,.pad > .vi-item{grid-column:auto;}
  .header{padding:15px 24px;}
  .subnav{padding:0 24px;}
  .nbtn{padding:13px 0 15px;}
  .td-desc,.td-descedit,.td-notes{max-width:900px;}
  .td-notes{min-height:150px;}
}
@media (min-width:1600px){
  .pad{padding:24px 40px 0;gap:0 36px;
       grid-template-columns:repeat(auto-fill,minmax(400px,1fr));}
  .header,.subnav{padding-left:40px;padding-right:40px;}
}
.crewfoot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#1a1a18;border-top:1px solid #3d3831;padding:10px 16px 14px;text-align:center;font-size:13px;color:#9a9384;letter-spacing:.15em;text-transform:uppercase;}
</style>

<body>
<div id="loading"><div id="ltitle">STRINGER OS</div><div id="lmsg">Loading...</div></div>
<div id="app" style="display:none">
  <div class="header" id="mainheader">
    <div><div class="htitle">STRINGER OS</div><div class="hname" id="hname"></div></div>
    <div class="ubadge"><div class="udot" id="udot"></div><span id="ulabel"></span></div>
  </div>
  <div class="content" id="content"></div>
  <div class="bnav" id="bnav" style="display:none">
    <button class="nbtn" id="nav-inbox" onclick="switchTab('inbox')"><span class="nicon">▤</span><span class="nlabel" id="inbox-label">INBOX</span></button>
    <button class="nbtn active" id="nav-mac" onclick="switchTab('mac')"><span class="nicon">◉</span><span class="nlabel">MAC</span></button>
    <button class="nbtn" id="nav-rhythm" onclick="switchTab('rhythm')"><span class="nicon">◔</span><span class="nlabel">RHYTHM</span></button>
    <button class="nbtn" id="nav-stringer" onclick="switchTab('stringer')"><span class="nicon">⬡</span><span class="nlabel">STRINGER</span></button>
    <button class="nbtn" id="nav-creative" onclick="switchTab('creative')"><span class="nicon">✦</span><span class="nlabel">CREATIVE</span></button>
    <button class="nbtn" id="nav-people" onclick="switchTab('people')"><span class="nicon">◈</span><span class="nlabel">PEOPLE</span></button>
  </div>
  <button class="capture-fab" id="capfab" onclick="openCapture()">+</button>
  <div class="crewfoot" id="crewfoot" style="display:none">Stringer Industries · Crew View</div>
</div>
<div class="modal-overlay" id="modal" onclick="closeCapture(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Quick Capture</div>
    <textarea id="capture-text" placeholder="Type anything — task, idea, note..."></textarea>
    <div class="route-chips">
      <button class="route-chip active" onclick="setRoute('MAC')">MAC</button>
      <button class="route-chip" onclick="setRoute('STRINGER')">STRINGER</button>
      <button class="route-chip" onclick="setRoute('CREATIVE')">CREATIVE</button>
      <button class="route-chip" onclick="setRoute('PEOPLE')">PEOPLE</button>
    </div>
    <div class="facts">
      <button class="bprim" onclick="submitCapture()">Capture</button>
      <button class="bcan" onclick="closeCapture()">Cancel</button>
    </div>
  </div>
</div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbyT8H0cR4gzOOgRsqMULSkHTaClDWpEKq8p28T-pBtMwUIUEbk9H4nOGrGoE88DrR22pw/exec';
var TOKEN = '';

function getToken() {
  var params = new URLSearchParams(window.location.search);
  return params.get('t') || '';
}

function apiUrl(extra) {
  var base = API + '?t=' + TOKEN;
  return extra ? base + '&' + extra : base;
}

var S = {
  user:null,projects:[],tasks:[],shopping:[],personal:[],ideas:[],people:[],voiceInbox:[],trades:[],schedule:[],tasksArchive:[],
  tab:'mac',sv:'today',sf:{type:'all',value:null},
  projectPage:null,taskPage:null,tradeFilter:'all',
  et:null,at:null,as:false,ap:false,ai:false,icat:'all',
  np:'MEDIUM',nc:'daily',nic:'Film',pp:null,addPerson:false,showAddProject:false,
  captureRoute:'MAC',se:null,sadd:false,tdDel:false,tdEditDesc:false,showArchive:false,
  triageId:null,triageDest:null
};
var PC={HIGH:'#e0553f',MEDIUM:'#f0a03f',LOW:'#c3bcab'};
var SC={'NEW':'#3f7cc4','IN PROGRESS':'#f0a03f','ON HOLD':'#c3bcab','DONE':'#5d9b6e'};
var CC={health:'#5d9b6e',daily:'#3f7cc4',personal:'#7a4a8c',service:'#e0553f',financial:'#f0a03f'};
var IC=['Film','Essay / TikTok','Art','Infrastructure','Venture','Music','Other'];
var PO={HIGH:0,MEDIUM:1,LOW:2};
var PRIOS=['HIGH','MEDIUM','LOW'];

function fmt$(n){if(!n&&n!==0)return'—';return'$'+Number(n).toLocaleString();}
function daysSince(d){if(!d)return 999;return Math.floor((new Date()-new Date(d))/(864e5));}
function contactColor(d){var n=daysSince(d);return n<7?'#5d9b6e':n<14?'#f0a03f':'#e0553f';}

// ─── RHYTHM (the day) ─────────────────────────────────────────
// MAC_PERSONAL has repeatedly picked up duplicate rows from concurrent saves,
// so never trust the payload: collapse by id, last write wins.
function dedupePersonal(list){
  var seen={},out=[];
  (list||[]).forEach(function(i){
    if(!i||!i.id)return;
    var k=String(i.id);
    if(seen[k]===undefined){seen[k]=out.length;out.push(i);}
    else out[seen[k]]=i;
  });
  return out;
}
// A row belongs to the daily rhythm if it carries a "pd" id (the Jul 29 daily
// set) or its text names a time of day. Everything else is a one-off
// responsibility and stays on the MAC tab.
function isRhythm(i){return /^pd/i.test(String(i.id||''))||rhythmHour(i)!==null;}
// Returns {h,m,approx} or null. approx=true means the hour was inferred from a
// word like "morning", not stated - the UI marks those so they don't read as
// commitments.
function rhythmHour(i){
  var s=String(i.description||'').toLowerCase();
  var m=s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
  if(m){
    var hr=parseInt(m[1],10)%12;
    if(m[3]==='pm')hr+=12;
    return {h:hr,m:m[2]?parseInt(m[2],10):0,approx:false};
  }
  if(/\bmidnight\b/.test(s))return {h:24,m:0,approx:false};
  if(/\bnoon\b/.test(s))return {h:12,m:0,approx:false};
  if(/\bmorning\b/.test(s))return {h:7,m:0,approx:true};
  if(/after dinner|\bevening\b/.test(s))return {h:19,m:0,approx:true};
  if(/\bnight\b/.test(s))return {h:21,m:0,approx:true};
  return null;
}
function fmtHour(h,m){
  var hh=h%12;if(hh===0)hh=12;
  var ap=(h>=12&&h<24)?'PM':'AM';
  return hh+(m?':'+('0'+m).slice(-2):'')+' '+ap;
}
function rhItem(i){
  var c=CC[i.category]||'#c3bcab';
  return'<div class="rhitem"><div class="catdot" style="background:'+c+';margin-top:8px"></div>'+
    '<div class="rhbody"><div class="rhdesc'+(i.done?' done':'')+'">'+esc(i.description)+'</div>'+
    '<div class="rhcat">'+esc(i.category)+'</div></div>'+
    '<button class="chkbtn '+(i.done?'done':'undone')+'" onclick="togP(\''+i.id+'\')">'+(i.done?'✓':'○')+'</button></div>';
}
function rRhythm(){
  var items=dedupePersonal(S.personal).filter(isRhythm);
  var timed=[],anytime=[];
  items.forEach(function(i){var t=rhythmHour(i);if(t)timed.push({i:i,t:t});else anytime.push(i);});
  timed.sort(function(a,b){return (a.t.h*60+a.t.m)-(b.t.h*60+b.t.m);});
  var open=items.filter(function(x){return !x.done;}).length;
  var h='<div class="pad">';
  h+=sl('The Day',open+' open / '+items.length);
  if(!items.length)h+='<div class="empty">No rhythm items yet</div>';
  // Group consecutive entries that share a slot so the time reads once.
  var gi=0;
  while(gi<timed.length){
    var slot=timed[gi].t,group=[timed[gi].i],gj=gi+1;
    while(gj<timed.length&&timed[gj].t.h===slot.h&&timed[gj].t.m===slot.m){group.push(timed[gj].i);gj++;}
    h+='<div class="rhrow"><div class="rhtime'+(slot.approx?' approx':'')+'">'+(slot.approx?'~':'')+fmtHour(slot.h,slot.m)+'</div>'+
       '<div class="rhitems">'+group.map(rhItem).join('')+'</div></div>';
    gi=gj;
  }
  if(anytime.length){
    h+='<div class="rhrow"><div class="rhtime approx">Anytime</div><div class="rhitems">'+anytime.map(rhItem).join('')+'</div></div>';
  }
  h+='<div class="rhnote">Times marked ~ are inferred from the wording, not set. '+
     'Anytime items have no hour in their text.</div>';
  h+=S.ap?apf():'<button class="addbtn" onclick="startAP()">+ Add personal item</button>';
  return h+'</div>';
}

function doTriage(id){
  var v=(S.voiceInbox||[]).find(function(x){return String(x.ID)===String(id);});
  if(!v){closeTriage();return;}
  var g=function(k){var el=document.getElementById('tr-'+k+'-'+id);return el?el.value:'';};
  var today=new Date().toISOString().slice(0,10);var d=S.triageDest;
  if(d==='task'){
    var desc=g('desc').trim();if(!desc)return;
    var task={ID:'tmp'+Date.now(),Project:g('proj'),Trade:g('trade')||'General',Description:desc,AssignedTo:g('who')||'Mac',Priority:g('prio')||'MEDIUM',Status:'NEW',ActionItem:'',Notes:''};
    S.tasks.push(task);
    apiCall({action:'addTask',project:task.Project,trade:task.Trade,description:task.Description,assignedTo:task.AssignedTo,priority:task.Priority,source:'Inbox'});
  }else if(d==='material'){
    var m=g('desc').trim();if(!m)return;
    var item={ID:'tmp'+Date.now(),Project:g('proj'),Trade:g('trade')||'General',Material:m,Qty:parseFloat(g('qty'))||1,Vendor:g('vendor').trim()||'TBD',Status:'NEEDED'};
    S.shopping.push(item);
    apiCall({action:'addShoppingItem',project:item.Project,trade:item.Trade,material:item.Material,qty:item.Qty,vendor:item.Vendor,source:'Inbox'});
  }else if(d==='idea'){
    var tx=g('desc').trim();if(!tx)return;
    S.ideas.unshift({id:'i'+Date.now(),text:tx,category:g('cat')||'Film',createdAt:today});
    apiCall({action:'saveIdeas',ideas:JSON.stringify(S.ideas)});
  }else if(d==='sched'){
    var dt=g('date').trim();if(!dt)return;
    var e={ID:'tmp'+Date.now(),Date:dt,Person:g('who')||'Mac',StartTime:g('start'),EndTime:g('end'),Location:g('loc'),Project:g('proj'),Notes:g('desc'),Status:'PLANNED'};
    S.schedule.push(e);
    apiCall({action:'addScheduleEntry',date:e.Date,person:e.Person,startTime:e.StartTime,endTime:e.EndTime,location:e.Location,project:e.Project,notes:e.Notes});
  }else if(d==='personal'){
    var pd=g('desc').trim();if(!pd)return;
    S.personal.push({id:'p'+Date.now(),description:pd,done:false,category:g('cat')||'daily',createdAt:today});
    apiCall({action:'savePersonalItems',items:JSON.stringify(S.personal)});
  }else if(d==='contact'){
    var nm=g('name').trim();if(!nm)return;
    var person={ID:'tmp'+Date.now(),Name:nm,Role:g('role'),Email:g('email'),Phone:g('phone'),LastContact:today,LastContactNote:g('note'),NextAction:'',Project:''};
    S.people.push(person);
    apiCall({action:'addPerson',name:person.Name,role:person.Role,email:person.Email,phone:person.Phone,note:person.LastContactNote});
  }else{closeTriage();return;}
  S.voiceInbox=(S.voiceInbox||[]).filter(function(x){return String(x.ID)!==String(id);});
  closeTriage();
  apiCall({action:'processVoiceEntry',id:id});
}

var PERSONC={Mac:'#f0a03f',Christian:'#3f7cc4',Mitchell:'#5d9b6e',Tracy:'#7a4a8c'};

function timeMin(t){
  if(!t)return 9999;
  var m=String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m)return 9999;
  var h=parseInt(m[1],10)%12;if(/pm/i.test(m[3]))h+=12;
  return h*60+parseInt(m[2],10);
}
function dayLabel(ds){
  var p=String(ds).split('-');if(p.length<3)return esc(String(ds));
  var d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));
  var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return days[d.getDay()]+' '+months[d.getMonth()]+' '+d.getDate();
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}

function rSchedule(){
  var own=S.user.role==='owner';
  var td=todayStr();
  var upcoming=S.schedule.filter(function(e){return e.Date>=td;});
  var dates=[...new Set(upcoming.map(function(e){return e.Date;}))].sort();
  var h='';
  if(!dates.length)h+='<div class="empty">Nothing scheduled</div>';
  dates.forEach(function(dt){
    h+=sl(dayLabel(dt),upcoming.filter(function(e){return e.Date===dt;}).length,dates.indexOf(dt)>0?'margin-top:20px':'');
    var entries=upcoming.filter(function(e){return e.Date===dt;}).sort(function(a,b){return timeMin(a.StartTime)-timeMin(b.StartTime);});
    entries.forEach(function(e){h+=schedItem(e,own);});
  });
  if(own){
    h+=S.sadd?schedAddForm():'<button class="addbtn" onclick="S.sadd=true;render()">+ Add schedule entry</button>';
  }
  return h;
}

function schedItem(e,own){
  var canEdit=own||e.Person===S.user.name;
  var ex=S.se===e.ID;
  var pc=PERSONC[e.Person]||'#c3bcab';
  var tent=e.Status==='TENTATIVE';
  var h='<div class="titem"><div class="trow"'+(canEdit?' onclick="togSE(\''+e.ID+'\')"':'')+'>';

function togSE(id){S.se=S.se===id?null:id;render();}
function setSEStatus(id,st){
  var e=S.schedule.find(function(x){return x.ID===id;});
  if(e)e.Status=st;render();
}
function saveSE(id){
  var e=S.schedule.find(function(x){return x.ID===id;});
  if(!e){S.se=null;render();return;}
  var g=function(pfx){return document.getElementById('se-'+pfx+'-'+id);};
  var st=g('start'),en=g('end'),no=g('notes'),dt=g('date'),pe=g('person'),lo=g('loc'),pr=g('proj');
  if(st)e.StartTime=st.value;
  if(en)e.EndTime=en.value;

  if(pe)e.Person=pe.value;
  if(lo)e.Location=lo.value;
  if(pr)e.Project=pr.value;
  S.se=null;render();
  apiCall({action:'updateScheduleEntry',id:id,date:e.Date,person:e.Person,startTime:e.StartTime,endTime:e.EndTime,location:e.Location,project:e.Project,notes:e.Notes,status:e.Status});
}
function delSE(id){
  S.schedule=S.schedule.filter(function(x){return x.ID!==id;});
  S.se=null;render();

}
function subSE(){
  var d=document.getElementById('sa-date');if(!d||!d.value.trim())return;

}

function rProjectDetail(){
  var proj=S.projects.find(function(p){return p.ID===S.projectPage;});

  var projTasks=S.tasks.filter(function(t){return String(t.Project)===S.projectPage;});

  var trades=[...new Set(projTasks.map(function(t){return String(t.Trade||'General');}))].sort();
  var filtered=S.tradeFilter==='all'?projTasks:projTasks.filter(function(t){return String(t.Trade)===S.tradeFilter;});

  var h='';
  if(budget){h+='<div class="proj-budget"><div class="proj-budget-item"><div class="proj-budget-label">Budget</div><div class="proj-budget-val">'+fmt$(budget)+'</div></div><div class="proj-budget-item"><div class="proj-budget-label">Actual</div><div class="proj-budget-val">'+fmt$(actual)+'</div></div><div class="proj-budget-item"><div class="proj-budget-label">Balance</div><div class="proj-budget-val '+(balance>=0?'green':'red')+'">'+fmt$(balance)+'</div></div>'+(proj.PercentComplete?'<div class="proj-budget-item"><div class="proj-budget-label">Complete</div><div class="proj-budget-val">'+esc(String(proj.PercentComplete))+'</div></div>':'')+'</div>';}
  var meta=[];
  if(proj.Status)meta.push('<span class="status-pill" style="background:'+(SC[String(proj.Status)]||'#9a9384')+'">'+esc(String(proj.Status))+'</span>');
  if(proj.PermitNum)meta.push('<span style="font-size:13px;color:#c3bcab">Permit: '+esc(String(proj.PermitNum))+'</span>');
  if(meta.length)h+='<div class="proj-status">'+meta.join('')+'</div>';
  h+='<div class="pad">';
  if(trades.length>1){h+='<div class="chips">'+ch('All',S.tradeFilter==='all',"setTF('all')");trades.forEach(function(t){h+=ch(t,S.tradeFilter===t,"setTF('"+t+"')");});h+='</div>';}
  h+=sl('Tasks (open)',open.length);
  if(!open.length)h+='<div class="empty">No open tasks</div>';
  open.forEach(function(t){h+=tiDetail(t);});
  h+=S.at==='detail'?atfDetail():'<button class="addbtn" onclick="startAT(\'detail\')">+ Add task</button>';
  var needed=projMats.filter(function(s){return s.Status!=='BOUGHT';});
  var bought=projMats.filter(function(s){return s.Status==='BOUGHT';});
  h+=sl('Materials',needed.length,'margin-top:20px');

  if(bought.length)h+='<div style="font-size:14px;color:#9a9384;padding:8px 0">+ '+bought.length+' bought</div>';
  h+=S.as?asfFull():'<button class="addbtn" onclick="startAS()">+ Add material</button>';
  return h+'</div>';

}

function atfSimple(){
  return'<div class="fbox"><input class="finput" id="ntd" placeholder="Task description..." autofocus><div class="frow"><select class="fsel" id="ntp">'+S.projects.map(function(p){return'<option value="'+p.ID+'">'+esc(String(p.Name))+'</option>';}).join('')+'</select><select class="fsel" id="nttr">'+S.trades.map(function(t){return'<option>'+t+'</option>';}).join('')+'</select><select class="fsel" id="nta">'+assigneeOptions('Mac')+'</select>'+['HIGH','MEDIUM','LOW'].map(function(p){return'<button class="bpill" onclick="setNP(\''+p+'\')" style="background:'+(S.np===p?PC[p]:'#2b2823')+';color:'+(S.np===p?'white':'#c3bcab')+'">'+p+'</button>';}).join('')+'</div><div class="facts"><button class="bprim" onclick="subT()">Add Task</button><button class="bcan" onclick="canAT()">Cancel</button></div></div>';
}

function rShopping(){
  var vnd=[...new Set(S.shopping.map(function(s){return String(s.Vendor||'');}))].filter(Boolean).sort();
  var pids=[...new Set(S.shopping.map(function(s){return String(s.Project||'');}))].filter(Boolean);
  var h='<div class="chips">'+ch('All',S.sf.type==='all',"setSF('all',null)");
  vnd.forEach(function(v){h+=ch(v,S.sf.type==='vendor'&&S.sf.value===v,"setSF('vendor','"+v+"')");});
  h+='<div class="cdiv"></div>';
  pids.forEach(function(pid){var pr=S.projects.find(function(p){return String(p.ID)===pid;});if(!pr)return;var ac=S.sf.type==='project'&&S.sf.value===pid;h+='<button class="chip'+(ac?' active':'')+'" style="'+(ac?'background:'+esc(String(pr.Color))+';border:none':'')+'" onclick="setSF(\'project\',\''+pid+'\')">'+esc(String(pr.Name))+'</button>';});
  h+='</div>';
  var fil=S.shopping.filter(function(s){if(S.sf.type==='all')return true;if(S.sf.type==='vendor')return String(s.Vendor)===S.sf.value;return String(s.Project)===S.sf.value;});
  var nd=fil.filter(function(s){return s.Status!=='BOUGHT';});
  var bt=fil.filter(function(s){return s.Status==='BOUGHT';});
  h+=sl('Needed',nd.length);
  if(!nd.length)h+='<div class="empty">Nothing needed</div>';
  nd.forEach(function(s){h+=shiFull(s);});
  if(bt.length){h+=sl('Bought',bt.length,'margin-top:20px');bt.forEach(function(s){h+=shiFull(s);});}
  h+=S.as?asfFull():'<button class="addbtn" onclick="startAS()">+ Add to shopping list</button>';
  return h;
}

function rCreative(){
  var fil=S.icat==='all'?S.ideas:S.ideas.filter(function(i){return i.category===S.icat;});
  var h='<div class="pad"><div class="chips">'+ch('All',S.icat==='all',"setIC('all')")+IC.map(function(c){return ch(c,S.icat===c,"setIC('"+c+"')");}).join('')+'</div>';
  h+=S.ai?'<div class="fbox" style="margin-bottom:12px"><textarea class="ftarea" id="nit" rows="3" placeholder="Drop the idea here..." autofocus></textarea><div class="frow">'+IC.map(function(c){return'<button class="bpill" onclick="setNIC(\''+c+'\')" style="background:'+(S.nic===c?'#f0a03f':'#2b2823')+';color:'+(S.nic===c?'white':'#c3bcab')+';font-size:13px">'+c+'</button>';}).join('')+'</div><div class="facts"><button class="bprim" onclick="subI()">Capture</button><button class="bcan" onclick="canAI()">Cancel</button></div></div>':'<button class="addbtn addcreative" onclick="startAI()">✦ Capture an idea</button>';
  h+=sl(S.icat==='all'?'All Ideas':S.icat,fil.length);
  if(!fil.length)h+='<div class="empty">No ideas yet</div>';
  fil.forEach(function(i){h+='<div class="iitem"><div class="irow"><div style="flex:1"><div class="icat">'+esc(i.category)+'</div><div class="itext">'+esc(i.text)+'</div><div class="idate">'+esc(i.createdAt)+'</div></div><button class="rmbtn" onclick="rmI(\''+i.id+'\')">×</button></div></div>';});
  return h+'</div>';
}

function rPeople(){
  var sorted=S.people.slice().sort(function(a,b){return daysSince(b.LastContact)-daysSince(a.LastContact);});
  var h='<div class="pad">'+sl('Contacts',sorted.length);
  sorted.forEach(function(p){
    var ex=S.pp===p.ID;
    var col=contactColor(String(p.LastContact));
    h+='<div class="person-item"><div class="person-row" onclick="togPP(\''+p.ID+'\')">';
    h+='<div class="person-dot" style="background:'+col+'"></div>';
    h+='<div class="person-body"><div class="person-name">'+esc(String(p.Name||''))+'</div><div class="person-role">'+esc(String(p.Role||''))+(p.Type&&String(p.Type)!=='Contact'?' · '+esc(String(p.Type)):'')+'</div>';
    if(p.LastContactNote)h+='<div class="person-note">'+esc(String(p.LastContactNote))+'</div>';
    if(p.NextAction)h+='<div class="person-next">→ '+esc(String(p.NextAction))+'</div>';
    var d=daysSince(String(p.LastContact));h+='<div class="person-days">'+(d<999?d+' days ago':'No contact logged')+'</div>';
    h+='</div></div>';
    if(ex){
      h+='<div class="person-detail"><div style="font-size:13px;color:#c3bcab;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Update Contact</div>';
      h+='<textarea id="pnote-'+p.ID+'" style="width:100%;background:#111110;border:1px solid #3d3831;border-radius:3px;color:#f2eee4;font-size:16px;padding:8px;outline:none;resize:none;height:70px;margin-bottom:8px">'+esc(String(p.LastContactNote||''))+'</textarea>';
      h+='<input id="pnext-'+p.ID+'" style="width:100%;background:#111110;border:1px solid #3d3831;border-radius:3px;color:#f2eee4;font-size:16px;padding:8px;outline:none;margin-bottom:10px" value="'+esc(String(p.NextAction||''))+'" placeholder="Next action...">';
      h+='<div class="frow" style="margin-bottom:10px"><select class="fsel" id="ptype-'+p.ID+'">'+['Sub','Vendor','Client','Contact','Crew'].map(function(tp){return'<option'+(String(p.Type||'Contact')===tp?' selected':'')+'>'+tp+'</option>';}).join('')+'</select><input class="fsel" id="prole-'+p.ID+'" value="'+esc(String(p.Role||''))+'" placeholder="Trade / role (e.g. Electrician)" style="flex:1"></div>';
      h+='<div class="facts"><button class="bprim" onclick="saveContact(\''+p.ID+'\')">Save</button><button class="bcan" onclick="togPP(null)">Cancel</button></div></div>';
    }
    h+='</div>';
  });
  h+='<button class="addbtn" onclick="S.addPerson=true;render()">+ Add contact</button>';
  if(S.addPerson){h+='<div class="fbox"><input class="finput" id="np-cname" placeholder="Name" autofocus><div class="frow"><select class="fsel" id="np-ctype"><option>Sub</option><option>Vendor</option><option>Client</option><option selected>Contact</option><option>Crew</option></select><input class="fsel" id="np-crole" placeholder="Trade / role" style="flex:1"></div><input class="finput" id="np-cemail" placeholder="Email"><input class="finput" id="np-cphone" placeholder="Phone"><textarea class="ftarea" id="np-cnote" placeholder="First note" rows="2"></textarea><div class="facts"><button class="bprim" onclick="subPerson()">Add</button><button class="bcan" onclick="S.addPerson=false;render()">Cancel</button></div></div>';}
  return h+'</div>';
}

// ─── ACTIONS ─────────────────────────────────────────────────
function openProject(id){S.projectPage=id;S.taskPage=null;S.tradeFilter='all';S.at=null;S.as=false;render();}
function openTask(id){S.taskPage=id;S.et=null;S.tdDel=false;S.tdEditDesc=false;render();}
function setTF(t){S.tradeFilter=t;render();}
function togET(id){S.et=S.et===id?null:id;render();}
// Priority edit. Mirrors setTS, but reverts and tells the user if the write
// fails - updateTaskPriority needs a backend New-version deploy to exist.
function setTP(id,pr){
  var t=S.tasks.find(function(x){return String(x.ID)===String(id);});
  if(!t)return;
  var prev=t.Priority;
  t.Priority=pr;render();
  apiCall({action:'updateTaskPriority',id:id,priority:pr}).then(function(r){
    if(r&&r.error){
      t.Priority=prev;render();
      alert('Priority not saved: '+r.error+(/Unknown action/i.test(r.error)?'\n\nThe backend needs a New version deploy.':''));
    }
  }).catch(function(){t.Priority=prev;render();alert('Priority not saved - network error.');});
}
function setTS(id,st){
  var t=S.tasks.find(function(x){return String(x.ID)===String(id);});
  if(t)t.Status=st;S.et=null;render();
  apiCall({action:'updateTaskStatus',id:id,status:st});
}
function togSH(id){
  var s=S.shopping.find(function(x){return String(x.ID)===String(id);});
  if(s)s.Status=s.Status==='BOUGHT'?'NEEDED':'BOUGHT';render();
  apiCall({action:'toggleShoppingStatus',id:id});
}
function togP(id){
  var i=S.personal.find(function(x){return x.id===id;});
  if(i)i.done=!i.done;render();
  apiCall({action:'savePersonalItems',items:JSON.stringify(S.personal)});
}
function togPP(id){S.pp=id;render();}
function setSF(t,v){S.sf={type:t,value:v};render();}
function setIC(c){S.icat=c;render();}
function startAT(ctx){S.at=ctx;S.np='MEDIUM';render();}
function canAT(){S.at=null;render();}
function setNP(p){S.np=p;render();}
function startAS(){S.as=true;render();}
function canAS(){S.as=false;render();}
function startAP(){S.ap=true;S.nc='daily';render();}
function canAP(){S.ap=false;render();}
function setNC(c){S.nc=c;render();}
function startAI(){S.ai=true;S.nic='Film';render();}
function canAI(){S.ai=false;render();}
function setNIC(c){S.nic=c;render();}

function saveContact(id){
  var n=document.getElementById('pnote-'+id);var x=document.getElementById('pnext-'+id);
  var tp=document.getElementById('ptype-'+id);var rl=document.getElementById('prole-'+id);
  var nv=n?n.value:'';var xv=x?x.value:'';var tv=tp?tp.value:'';var rv=rl?rl.value:'';
  var p=S.people.find(function(y){return y.ID===id;});
  if(p){p.LastContactNote=nv;p.NextAction=xv;if(tv)p.Type=tv;if(rv)p.Role=rv;p.LastContact=new Date().toISOString().slice(0,10);}
  S.pp=null;render();
  apiCall({action:'updateLastContact',id:id,note:nv,nextAction:xv});
  if(tv||rv)apiCall({action:'updatePersonType',id:id,type:tv,role:rv});
}

function doneVoice(id){
  S.voiceInbox=S.voiceInbox.filter(function(v){return v.ID!==id;});render();
  apiCall({action:'processVoiceEntry',id:id});
}

function openCapture(){
  S.captureRoute='MAC';
  var m=document.getElementById('modal');m.style.display='flex';
  setTimeout(function(){var t=document.getElementById('capture-text');if(t){t.value='';t.focus();}},50);
}
function closeCapture(e){if(!e||e.target===document.getElementById('modal'))document.getElementById('modal').style.display='none';}
function setRoute(r){S.captureRoute=r;document.querySelectorAll('.route-chip').forEach(function(b){b.classList.toggle('active',b.textContent===r);});}
function submitCapture(){
  var t=document.getElementById('capture-text');if(!t||!t.value.trim())return;
  var raw='['+S.captureRoute+'] '+t.value.trim();
  var entry={ID:'tmp'+Date.now(),Raw:raw,Source:S.user.name,CreatedAt:new Date().toISOString().slice(0,16),Status:'PENDING'};
  S.voiceInbox.unshift(entry);
  document.getElementById('modal').style.display='none';render();
  apiCall({action:'addVoiceEntry',raw:raw});
}

function subT(){
  var d=document.getElementById('ntd');if(!d||!d.value.trim())return;
  var p=document.getElementById('ntp');var tr=document.getElementById('nttr');var a=document.getElementById('nta');
  var projectId=S.projectPage||(p?p.value:'');
  var task={ID:'tmp'+Date.now(),Project:projectId,Trade:tr?tr.value:'General',Description:d.value.trim(),AssignedTo:a?a.value:'Mac',Priority:S.np,Status:'NEW',ActionItem:'',Source:'App',CreatedAt:new Date().toISOString().slice(0,10)};
  S.tasks.push(task);S.at=null;render();
  apiCall({action:'addTask',project:task.Project,trade:task.Trade,description:task.Description,assignedTo:task.AssignedTo,priority:task.Priority,source:'App'});
}

function subS(){
  var d=document.getElementById('nsd');if(!d||!d.value.trim())return;
  var tr=document.getElementById('nstr');var q=document.getElementById('nsq');var uc=document.getElementById('nsuc');var v=document.getElementById('nsv');
  var p=document.getElementById('nsp');
  var projectId=S.projectPage||(p?p.value:'');
  var item={ID:'tmp'+Date.now(),Project:projectId,Trade:tr?tr.value:'General',Material:d.value.trim(),Qty:parseFloat(q?q.value:1)||1,UnitCost:uc&&uc.value?uc.value:'',Vendor:v&&v.value.trim()?v.value.trim():'TBD',Status:'NEEDED',Source:'App',CreatedAt:new Date().toISOString().slice(0,10)};
  S.shopping.push(item);S.as=false;render();
  apiCall({action:'addShoppingItem',project:item.Project,trade:item.Trade,material:item.Material,qty:item.Qty,unitCost:item.UnitCost,vendor:item.Vendor,source:'App'});
}

function subP(){
  var i=document.getElementById('npt');if(!i||!i.value.trim())return;
  var item={id:'p'+Date.now(),description:i.value.trim(),done:false,category:S.nc,createdAt:new Date().toISOString().slice(0,10)};
  S.personal.push(item);S.ap=false;render();
  apiCall({action:'savePersonalItems',items:JSON.stringify(S.personal)});
}

function subI(){
  var i=document.getElementById('nit');if(!i||!i.value.trim())return;
  var idea={id:'i'+Date.now(),text:i.value.trim(),category:S.nic,createdAt:new Date().toISOString().slice(0,10)};
  S.ideas.unshift(idea);S.ai=false;render();
  apiCall({action:'saveIdeas',ideas:JSON.stringify(S.ideas)});
}

function rmI(id){S.ideas=S.ideas.filter(function(i){return i.id!==id;});render();apiCall({action:'saveIdeas',ideas:JSON.stringify(S.ideas)});}

function subPerson(){
  var n=document.getElementById('np-cname');if(!n||!n.value.trim())return;
  var r=document.getElementById('np-crole');var e=document.getElementById('np-cemail');var ph=document.getElementById('np-cphone');var nt=document.getElementById('np-cnote');var ty=document.getElementById('np-ctype');
  var person={ID:'tmp'+Date.now(),Name:n.value.trim(),Role:r?r.value:'',Email:e?e.value:'',Phone:ph?ph.value:'',LastContact:new Date().toISOString().slice(0,10),LastContactNote:nt?nt.value:'',NextAction:'',Project:'',Type:ty?ty.value:'Contact'};
  S.people.push(person);S.addPerson=false;render();
  apiCall({action:'addPerson',name:person.Name,role:person.Role,email:person.Email,phone:person.Phone,note:person.LastContactNote,type:person.Type});
}

function subProject(){
  var n=document.getElementById('np-name');if(!n||!n.value.trim())return;
  var cl=document.getElementById('np-client');var lo=document.getElementById('np-location');
  var st=document.getElementById('np-status');var bu=document.getElementById('np-budget');var pe=document.getElementById('np-permit');
  var colors=['#e0553f','#f0a03f','#3f7cc4','#5a3a8c','#2a6b52','#6b4a10','#8c6a2a','#5d9b6e'];
  var color=colors[S.projects.length%colors.length];
  var proj={ID:'tmp'+Date.now(),Name:n.value.trim(),Status:st?st.value:'NEW',Client:cl?cl.value:'',Location:lo?lo.value:'',Color:color,Budget:bu?bu.value:'',Actual:0,PermitNum:pe?pe.value:'',Jurisdiction:'',InspectionsReq:'',PercentComplete:'0%'};
  S.projects.push(proj);S.showAddProject=false;render();
  apiCall({action:'addProject',name:proj.Name,status:proj.Status,client:proj.Client,location:proj.Location,color:proj.Color,budget:proj.Budget,permitNum:proj.PermitNum});
}

// Pick readable text for a coloured background. The 2026-09-02 contrast pass
// lightened the status/priority palette, so white-on-colour no longer works
// for the lighter ones (ON HOLD, MEDIUM, LOW, IN PROGRESS).
function onColor(hex){
  var h=String(hex||'').replace('#','');
  if(h.length!==6)return '#fff';
  function lin(c){c=parseInt(c,16)/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
  var L=0.2126*lin(h.slice(0,2))+0.7152*lin(h.slice(2,4))+0.0722*lin(h.slice(4,6));
  return L>0.35?'#15150f':'#fff';
}
function esc(s){if(s===null||s===undefined)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sl(label,count,style){return'<div class="slabel"'+(style?' style="'+style+'"':'')+'><span>'+label+'</span><span class="cnt">('+count+')</span><hr></div>';}
function sb(v,label){return'<button class="sbtn'+(S.sv===v?' active':'')+'" onclick="svSwitch(\''+v+'\')">'+label+'</button>';}
function ch(label,active,oc){return'<button class="chip'+(active?' active':'')+'" onclick="'+oc+'">'+esc(label)+'</button>';}
